[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "jan-setu-api"
version = "0.1.0"
description = "Jan Setu Grievance Portal backend built with FastAPI"
authors = ["Jan Setu Team <team@jansetu.com>"]
readme = "README.md"
license = "MIT"
keywords = ["fastapi", "firebase", "sqlite", "twilio", "openai"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Environment :: Web Environment"
]
packages = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11"
fastapi = "*"
uvicorn = {extras = ["standard"], version = "*"}
firebase-admin = "*"
python-dotenv = "*"
twilio = "*"
openai = "*"
requests = "*"

[tool.poetry.dev-dependencies]
