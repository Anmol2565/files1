[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jan-setu-api"
version = "0.1.0"
description = "Jan Setu Grievance Portal backend built with FastAPI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [ { name = "Jan Setu Team" } ]
keywords = ["fastapi", "firebase", "sqlite", "twilio", "openai"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Environment :: Web Environment"
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "firebase-admin",
    "python-dotenv",
    "twilio",
    "openai"
]

[tool.setuptools]
packages = []
